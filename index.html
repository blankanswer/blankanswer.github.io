  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // 从JSON文件中获取数据
      fetch('/content.json')
        .then(response => response.json())
        .then(data => {
          // 动态填充网站标题
          document.title = data.siteTitle;
          document.querySelectorAll('.navbar-brand').forEach(brand => {
            brand.textContent = data.siteTitle;
          });
          document.querySelectorAll('meta[property="og:title"]').forEach(meta => {
            meta.setAttribute('content', data.siteTitle);
          });
          document.querySelectorAll('meta[property="og:site_name"]').forEach(meta => {
            meta.setAttribute('content', data.siteTitle);
          });

          // 填充关于我们部分
          const aboutSection = document.querySelector('#about h1');
          if (aboutSection) {
            aboutSection.textContent = data.about.title;
          }
          const aboutContent = document.querySelector('#about .article-style');
          if (aboutContent) {
            aboutContent.innerHTML = '';
            data.about.content.forEach(paragraph => {
              const p = document.createElement('p');
              p.textContent = paragraph;
              aboutContent.appendChild(p);
            });
          }

          // 填充个人资料部分
          const profileSection = document.querySelector('#profile');
          if (profileSection && data.about.profile) {
            const profileHTML = `
              <img class="avatar avatar-circle" 
                src="${data.about.profile.avatar}"
                alt="${data.about.profile.name}">
              
              <div class="portrait-title">
                <h2>${data.about.profile.name}</h2>
                <h3><a href="${data.about.profile.website}">${data.about.profile.website}</a></h3>
              </div>
              
              <ul class="network-icon" aria-hidden="true">
              </ul>
            `;
            profileSection.innerHTML = profileHTML;
          }

          // 填充研究方向部分
          const projectsSection = document.querySelector('#projects .js-layout-row');
          if (projectsSection) {
            projectsSection.innerHTML = '';
            data.projects.forEach(project => {
              const projectHTML = `
                <div class="col-12 isotope-item ">
                  <div class="media stream-item">
                    <div class="media-body">
                      <div class="section-subheading article-title mb-0 mt-0">
                        <a href="/project/${project.id}/">${project.title}</a>
                      </div>
                      <a href="/project/${project.id}/" class="summary-link">
                        <div class="article-style">
                          ${project.description}
                        </div>
                      </a>
                      <div class="stream-meta article-metadata">
                      </div>
                    </div>
                    <div class="ml-3">
                      <a href="/project/${project.id}/">
                        <img src="${project.image}" alt="${project.title}" loading="lazy">
                      </a>
                    </div>
                  </div>
                </div>
              `;
              projectsSection.innerHTML += projectHTML;
            });
          }

          // 填充研究动态部分
          const postsSection = document.querySelector('#posts .col-12.col-lg-8');
          if (postsSection) {
            // 保留标题
            const sectionHeading = postsSection.previousElementSibling;
            postsSection.innerHTML = '';

            data.posts.forEach(post => {
              const postHTML = `
                <div class="media stream-item">
                  <div class="media-body">
                    <div class="section-subheading article-title mb-0 mt-0">
                      <a href="/post/${post.id}/">${post.title}</a>
                    </div>
                    <a href="/post/${post.id}/" class="summary-link">
                      <div class="article-style">
                        ${post.description}
                      </div>
                    </a>
                    <div class="stream-meta article-metadata">
                      <div class="article-metadata">
                        <div>
                          <span>${post.author}</span>
                        </div>
                        <span class="article-date">${post.date}</span>
                        <span class="middot-divider"></span>
                        <span class="article-reading-time">${post.readingTime}</span>
                      </div>
                    </div>
                  </div>
                  <div class="ml-3">
                    <a href="/post/${post.id}/">
                      <img src="${post.image}" alt="${post.title}" loading="lazy">
                    </a>
                  </div>
                </div>
              `;
              postsSection.innerHTML += postHTML;
            });

            // 添加"查看全部"链接
            postsSection.innerHTML += `
              <div class="see-all">
                <a href="/post/">
                  See all posts
                  <i class="fas fa-angle-right"></i>
                </a>
              </div>
            `;
          }

          // 填充研究团队部分
          const peopleSection = document.querySelector('#people .people-widget');
          if (peopleSection) {
            peopleSection.innerHTML = '';

            // 教师团队
            peopleSection.innerHTML += `<div class="col-md-12"><h2 class="mb-4">教师团队</h2></div>`;
            data.people.faculty.forEach(person => {
              peopleSection.innerHTML += `
                <div class="col-12 col-sm-auto people-person">
                  <img class="avatar avatar-circle" src="${person.image}" alt="${person.name}">
                  <div class="portrait-title">
                    <h2>${person.name}</h2>
                    ${person.link ? `<h3><a href="${person.link}">${person.link}</a></h3>` : ''}
                  </div>
                </div>
              `;
            });

            // 博士生
            peopleSection.innerHTML += `<div class="col-md-12"><h2 class="mb-4">博士生</h2></div>`;
            data.people.phdStudents.forEach(person => {
              peopleSection.innerHTML += `
                <div class="col-12 col-sm-auto people-person">
                  <img class="avatar avatar-circle" src="${person.image}" alt="${person.name}">
                  <div class="portrait-title">
                    <h2>${person.name}</h2>
                    <h3>${person.description}</h3>
                  </div>
                </div>
              `;
            });

            // 硕士生
            peopleSection.innerHTML += `<div class="col-md-12"><h2 class="mb-4">硕士生</h2></div>`;
            data.people.masterStudents.forEach(person => {
              peopleSection.innerHTML += `
                <div class="col-12 col-sm-auto people-person">
                  <img class="avatar avatar-circle" src="${person.image}" alt="${person.name}">
                  <div class="portrait-title">
                    <h2>${person.name}</h2>
                    <h3>${person.description}</h3>
                  </div>
                </div>
              `;
            });

            // 合作导师
            peopleSection.innerHTML += `<div class="col-md-12"><h2 class="mb-4">合作导师</h2></div>`;
            data.people.collaborators.forEach(person => {
              peopleSection.innerHTML += `
                <div class="col-12 col-sm-auto people-person">
                  <img class="avatar avatar-circle" src="${person.image}" alt="${person.name}">
                  <div class="portrait-title">
                    <h2>${person.name}</h2>
                    <h3><a href="${person.link}">${person.link}</a></h3>
                  </div>
                </div>
              `;
            });

            // 毕业生
            peopleSection.innerHTML += `<div class="col-md-12"><h2 class="mb-4">毕业生</h2></div>`;
            data.people.alumni.forEach(person => {
              peopleSection.innerHTML += `
                <div class="col-12 col-sm-auto people-person">
                  <img class="avatar avatar-circle" src="${person.image}" alt="${person.name}">
                  <div class="portrait-title">
                    <h2>${person.name}</h2>
                    <h3>${person.description}</h3>
                  </div>
                </div>
              `;
            });
          }

          // 填充研究成果部分
          const accomplishmentsSection = document.querySelector('#accomplishments .col-12.col-lg-8');
          if (accomplishmentsSection) {
            // 保留标题
            const sectionHeading = accomplishmentsSection.previousElementSibling;
            // 添加容器元素
            accomplishmentsSection.innerHTML = '<div class="accomplishments-container"></div>';
            const container = accomplishmentsSection.querySelector('.accomplishments-container');

            data.accomplishments.forEach(accomplishment => {
              // 添加横向排列的CSS样式
              if (!document.getElementById('accomplishments-styles')) {
                const style = document.createElement('style');
                style.id = 'accomplishments-styles';
                style.textContent = `
                  .accomplishments-container {
                    display: flex;
                    flex-direction: row;
                    gap: 10px;
                    justify-content: space-around;
                  }
                  .accomplishment-item {
                    box-sizing: border-box;
                    padding: 10px 0;
                    border-bottom: 1px solid #eee;
                  }
                  .accomplishment-item:last-child {
                    border-bottom: none;
                  }
                  .accomplishment-title {
                    font-weight: bold;
                    margin-bottom: 10px;
                    color: #333;
                  }
                  .accomplishment-description {
                    font-size: 0.9em;
                    margin-bottom: 10px;
                    color: #666;
                  }
                  .accomplishment-meta {
                    font-size: 0.8em;
                    color: #999;
                  }
                `;
                document.head.appendChild(style);
              }

              const accomplishmentHTML = `
                <div class="accomplishment-item">
                  <div class="accomplishment-title">
                    <a href="/accomplishments/${accomplishment.id}/">${accomplishment.title}</a>
                  </div>
                  <div class="accomplishment-description">
                    ${accomplishment.description}
                  </div>
                  <div class="accomplishment-meta">
                    <div>${accomplishment.author}</div>
                    <div>${accomplishment.date}</div>
                  </div>
                </div>
              `;
              container.innerHTML += accomplishmentHTML;
            });
          }
        })
        .catch(error => console.error('Error loading content:', error));
    });
  </script>

</body>

</html>
