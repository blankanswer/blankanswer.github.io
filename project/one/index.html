  <script>

    fetch('./content.json')
      .then(response => {
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        return response.json();
      })
      .then(data => {
        const projectData = data.project;

        // 更新页面标题和元数据
        document.title = projectData.title + ' | 厦门大学 Ying-Lab';
        document.getElementById('page-title').textContent = projectData.title + ' | 厦门大学 Ying-Lab';
        document.getElementById('meta-author').content = projectData.author.name;
        document.getElementById('meta-description').content = projectData.description;
        document.getElementById('og-title').content = projectData.title + ' | 厦门大学 Ying-Lab';
        document.getElementById('og-description').content = projectData.description;
        document.getElementById('og-image').content = projectData.image;
        document.getElementById('twitter-image').content = projectData.image;

        // 更新文章内容
        document.getElementById('article-title').textContent = projectData.title;
        document.getElementById('article-date').textContent = projectData.date;

        // 添加特色图片
        const imageContainer = document.getElementById('featured-image-container');
        const img = document.createElement('img');
        img.src = projectData.image;
        img.alt = projectData.title;
        img.className = 'featured-image';
        imageContainer.appendChild(img);

        // 添加文章内容
        const contentContainer = document.getElementById('article-content');
        projectData.content.forEach(paragraph => {
          const p = document.createElement('p');
          p.textContent = paragraph;
          contentContainer.appendChild(p);
        });

        // 更新作者信息
        const authorCard = document.getElementById('author-card');
        const authorAvatarContainer = authorCard.querySelector('.media-body');

        // 清空作者容器
        while (authorAvatarContainer.firstChild) {
          authorAvatarContainer.removeChild(authorAvatarContainer.firstChild);
        }

        // 创建并添加头像
        const avatar = document.createElement('img');
        avatar.className = 'avatar mr-3 avatar-circle';
        avatar.src = projectData.author.avatar;
        avatar.alt = projectData.author.name;
        authorCard.insertBefore(avatar, authorAvatarContainer);

        // 创建并添加作者信息
        const authorName = document.createElement('h5');
        authorName.className = 'card-title';
        authorName.textContent = projectData.author.name;
        authorAvatarContainer.appendChild(authorName);

        const authorWebsite = document.createElement('h6');
        authorWebsite.className = 'card-subtitle';
        const websiteLink = document.createElement('a');
        websiteLink.href = projectData.author.website;
        websiteLink.textContent = projectData.author.website;
        authorWebsite.appendChild(websiteLink);
        authorAvatarContainer.appendChild(authorWebsite);

        // 添加网络图标
        const networkIcons = document.createElement('ul');
        networkIcons.className = 'network-icon';
        networkIcons.setAttribute('aria-hidden', 'true');
        authorAvatarContainer.appendChild(networkIcons);

        // 更新JSON-LD结构化数据
        const jsonLdElement = document.querySelector('script[type="application/ld+json"]');
        if (jsonLdElement) {
          try {
            const jsonLdData = JSON.parse(jsonLdElement.textContent);
            jsonLdData.headline = projectData.title;
            jsonLdData.image = [projectData.image];
            jsonLdData.description = projectData.description;
            jsonLdElement.textContent = JSON.stringify(jsonLdData);
          } catch (e) {
            console.error('Error parsing or updating JSON-LD data:', e);
          }
        }
      })
      .catch(error => {
        console.error('There was a problem with the fetch operation:', error);
      });
  </script>
